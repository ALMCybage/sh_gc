; Production PHP settings for the web API container.

expose_php = Off
memory_limit = 256M
max_execution_time = 30
post_max_size = 12M
upload_max_filesize = 12M
date.timezone = UTC

; Log to stderr so Cloud Logging collects it; never render errors into a
; JSON API response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; The container filesystem is immutable, so opcache never needs to stat files.
; This is the single biggest throughput win for a Laravel pod.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
