[global]
error_log = /dev/stderr
daemonize = no
; Restart the pool if too many children segfault, rather than bleeding capacity.
emergency_restart_threshold = 5
emergency_restart_interval = 1m
process_control_timeout = 10s

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.backlog = 1024

; "static" fits a container with a fixed CPU/memory request better than the
; dynamic pool: the pod is sized for a known concurrency, and the HPA adds pods
; rather than each pod growing unpredictably.
pm = static
pm.max_children = 16
pm.max_requests = 1000

; php-fpm must not swallow the environment; every setting arrives from the
; Kubernetes ConfigMap and Secret.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Surface slow requests (a stuck Cloud SQL query, a hanging Pub/Sub publish)
; with a backtrace instead of only a timeout.
request_slowlog_timeout = 5s
slowlog = /dev/stderr
request_terminate_timeout = 30s

; Readiness/liveness for the fpm process itself, scraped by the sidecar if wanted.
pm.status_path = /fpm-status
ping.path = /fpm-ping
