# Workload Identity annotations. The Google service account emails contain the
# environment, so they cannot live in the base.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-api
  namespace: sequifi
  annotations:
    iam.gke.io/gcp-service-account: sequifi-prod-web-api@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: sequifi
  annotations:
    iam.gke.io/gcp-service-account: sequifi-prod-worker@PROJECT_ID.iam.gserviceaccount.com
