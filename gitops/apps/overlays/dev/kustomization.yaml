apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sequifi

resources:
  - ../../shared/base
  - ../../web-api/base
  - ../../worker/base

images:
  - name: REGION-docker.pkg.dev/PROJECT_ID/sequifi/web-api
    newName: us-central1-docker.pkg.dev/PROJECT_ID/sequifi/web-api
    newTag: PLACEHOLDER_WEB_TAG
  - name: REGION-docker.pkg.dev/PROJECT_ID/sequifi/worker
    newName: us-central1-docker.pkg.dev/PROJECT_ID/sequifi/worker
    newTag: PLACEHOLDER_WORKER_TAG

configMapGenerator:
  - name: app-config
    behavior: create
    literals:
      # local, not production: this is what enables debug output AND what keeps
      # TENANCY_TRUST_HEADER usable for smoke tests. In production the app
      # force-disables the header regardless of config.
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_NAME=Sequifi (dev)
      - APP_URL=https://acme.dev.sequifi.com

      - LOG_CHANNEL=gcp
      - LOG_LEVEL=debug

      - CLOUDSQL_INSTANCE=PROJECT_ID:us-central1:sequifi-dev-mysql
      - DB_CONNECTION=mysql
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_DATABASE=tenant_acme
      - DB_USERNAME=app

      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=REDIS_HOST_PLACEHOLDER
      - REDIS_PORT=6379

      - SESSION_SECURE_COOKIE=true
      - SESSION_SAME_SITE=lax
      - SANCTUM_STATEFUL_DOMAINS=*.dev.sequifi.com

      - GOOGLE_CLOUD_PROJECT=PROJECT_ID
      - PUBSUB_DRIVER=rest
      - PUBSUB_TOPIC_PAYROLL=payroll-calc-events
      - PUBSUB_TOPIC_SALES=sales-import
      - FIRESTORE_DRIVER=rest
      - FIRESTORE_DATABASE=(default)
      - FIRESTORE_COLLECTION=api_request_statuses

      - TENANCY_HEADER=X-Tenant
      - TENANCY_BASE_DOMAINS=dev.sequifi.com
      - TENANCY_SCHEMA_PREFIX=tenant_
      - TENANCY_FALLBACK_TENANT=acme
      # Allowed in dev so smoke tests can address a tenant by header instead of by
      # hostname. TenancyIsolationTest proves this cannot be used to cross tenants
      # when it is off, and production forces it off.
      - TENANCY_TRUST_HEADER=true

      # Higher than prod: a load test against dev should exercise the app, not the
      # rate limiter.
      - RATE_LIMIT_PER_TENANT=6000
      - RATE_LIMIT_PER_CLIENT=1200

    files:
      - TENANTS_JSON=files/tenants.json

  - name: worker-config
    behavior: create
    literals:
      - GOOGLE_CLOUD_PROJECT=PROJECT_ID
      - LOG_LEVEL=debug

      - CLOUDSQL_INSTANCE=PROJECT_ID:us-central1:sequifi-dev-mysql
      - DB_HOST=127.0.0.1
      - DB_PORT=3306
      - DB_USERNAME=app
      # Dev Cloud SQL is a db-custom-1-3840 with max_connections=200, so the per-pod
      # budget has to be much smaller than prod's.
      - DB_MAX_OPEN_CONNS=2
      - DB_MAX_IDLE_CONNS=1
      - DB_MAX_OPEN_SCHEMAS=4
      - DB_QUERY_TIMEOUT=60s

      - PUBSUB_SUB_PAYROLL=payroll-calc-events-worker
      - PUBSUB_SUB_SALES=sales-import-worker
      - PUBSUB_MAX_OUTSTANDING=10
      - PUBSUB_NUM_GOROUTINES=2
      - PUBSUB_ACK_EXTENSION=5m
      - WORKER_MAX_RETRIES=5

      - STATUS_DRIVER=firestore
      - FIRESTORE_DATABASE=(default)
      - FIRESTORE_COLLECTION=api_request_statuses

      - HTTP_ADDR=:8081
      - SHUTDOWN_TIMEOUT=30s
      - TENANCY_SCHEMA_PREFIX=tenant_

    files:
      - TENANTS_JSON=files/tenants.json

patches:
  - path: patches/service-accounts.yaml
  - path: patches/external-secrets.yaml
  # Dev skips the canary: waiting 12 minutes to see a change on a dev cluster is
  # friction with no safety benefit, because dev has no users to protect. This patch
  # also sets the replica counts.
  #
  # NOTE: the `replicas:` transformer cannot be used here. It only understands
  # Deployment, StatefulSet, ReplicaSet and ReplicationController, so it errors on a
  # Rollout CRD with a confusing "does not match a config with the following GVK".
  - path: patches/fast-rollout.yaml
