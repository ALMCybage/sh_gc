worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured access log: Cloud Logging indexes the fields, and the tenant is
    # taken straight from the Host header so per-tenant traffic is queryable.
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"x_forwarded_for":"$http_x_forwarded_for",'
        '"host":"$host",'
        '"tenant":"$http_x_tenant",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_duration":"$upstream_response_time",'
        '"trace":"$http_x_cloud_trace_context"'
    '}';

    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 650;
    # GCP's external HTTPS load balancer keeps connections alive for 600s.
    # Staying above that avoids the LB reusing a socket nginx just closed,
    # which surfaces as sporadic 502s at the edge.
    keepalive_requests 10000;

    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # php-fpm is a sidecar in the same pod, so it is always reachable on
    # localhost. docker-compose reproduces that by putting nginx in the web-api
    # container's network namespace.
    upstream php {
        server 127.0.0.1:9000;
        keepalive 32;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;

        # Health checks bypass the access log to keep it readable.
        location = /healthz {
            access_log off;
            try_files $uri /index.php?$query_string;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 30s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
