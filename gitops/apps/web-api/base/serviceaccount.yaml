# Workload Identity: bound to a Google service account by
# terraform/modules/iam, so pods get short-lived credentials from the GKE metadata
# server and no key file exists anywhere.
#
# The annotation value is patched per environment (the GSA email contains the
# environment name).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-api
  annotations:
    iam.gke.io/gcp-service-account: PLACEHOLDER
