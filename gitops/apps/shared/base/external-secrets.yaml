####################################################################
# Secrets come from Secret Manager, not from Git.
#
# The previous version of this repo shipped a Kubernetes Secret template with
# REPLACE_ME values. That has two problems: rotating a password means a redeploy, and
# sooner or later somebody commits a real value.
#
# External Secrets Operator reads Secret Manager and materialises a Kubernetes Secret,
# refreshing it on an interval. Rotation becomes "add a new secret version" with no
# deploy at all, and the only thing in Git is the NAME of the secret.
#
# Authentication is Workload Identity - the same mechanism the application uses - so
# there is still no key file anywhere.
####################################################################
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: sequifi
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: REGION
          clusterName: CLUSTER_NAME
          serviceAccountRef:
            name: web-api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: sequifi
spec:
  # Picks up a new Secret Manager version within an hour without a deploy. Shorter
  # intervals cost API calls for no benefit: rotation is not an emergency operation.
  refreshInterval: 1h

  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore

  target:
    name: app-secrets
    creationPolicy: Owner

  data:
    # Encrypts session cookies. Must be identical across every pod, or pods reject
    # each other's sessions and users are signed out depending on which pod answers.
    - secretKey: APP_KEY
      remoteRef:
        key: SECRET_PREFIX-app-key

    - secretKey: DB_PASSWORD
      remoteRef:
        key: SECRET_PREFIX-db-password

    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: SECRET_PREFIX-redis-auth

  # Values that are not secret but belong in the same env block for convenience.
  dataFrom: []
