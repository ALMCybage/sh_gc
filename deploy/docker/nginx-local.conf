# Local stand-in for the GCP load balancer's URL map.
#
# In production the edge splits traffic two ways:
#   /api/*, /sanctum/*, /healthz, /readyz  -> web-api pods (NEG)
#   everything else                        -> Cloud Storage + Cloud CDN
#
# There is no load balancer locally, so this nginx does the same split: it serves
# the built SPA from disk and proxies the API to php-fpm. That gives development
# the property that matters most - the SPA and the API are SAME ORIGIN - so session
# cookies behave exactly as they will in production and there is no CORS anywhere.
#
# NOTE: this is NOT the config the GKE pod runs. The pod's nginx (see
# deploy/k8s/02-config.yaml) serves no static files at all, because the frontend is
# on the CDN. Keeping them separate is deliberate; sharing one file would mean
# shipping dead static-file config into the pod.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"host":"$host",'
        '"tenant":"$http_x_tenant",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"duration_ms":$request_time,'
        '"upstream":"$upstream_addr"'
    '}';

    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 512;

    upstream php {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    server {
        listen 8080 default_server;
        server_name _;

        # ---- API: proxied to php-fpm --------------------------------------
        location ~ ^/(api|sanctum)/ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 30s;
        }

        location ~ ^/(healthz|readyz)$ {
            access_log off;
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        }

        # ---- SPA: static files, stands in for GCS + Cloud CDN --------------
        location / {
            root /var/www/frontend;
            # Client-side routing: an unknown path is a React route, not a 404.
            # The GCS backend bucket does the same with its error-page setting.
            try_files $uri $uri/ /index.html;

            # Mirrors the cache headers deploy-frontend.sh sets on the bucket.
            location ~* ^/assets/.*\.(js|css|woff2?|svg|png|jpg)$ {
                root /var/www/frontend;
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            location = /index.html {
                root /var/www/frontend;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }
    }
}
